trigger:
  branches:
    include:
    - "master"
  paths:
    include:
    - dev.tfvars

pool:
  vmImage: ubuntu-latest

variables:
  rg-grp: "tuns8storageaccount"
  bkstg: "tuns8storageaccount"
  bkcontainer: "tfsate"
  bkstrgkey: "devopspiple.terraform.tfsate"

stages:
  - stage: TerraformValidate
    jobs:
      - job: Plan
        continueOnError: false
        steps:
          - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@0
            displayName: Terraform install
            inputs:
              terraformVersion: "latest"
          - task: TerraformTaskV4@4
            displayName: Terraform init
            inputs:
              provider: 'azurerm'
              command: 'init'
              commandOptions: '-reconfigure'
              backendServiceArm: 'mysubscription-azuresub'
              backendAzureRmResourceGroupName: '$(rg-grp)'
              backendAzureRmStorageAccountName: '$(bkstg)'
              backendAzureRmContainerName: '$(bkcontainer)'
              backendAzureRmKey: '$(bkstrgkey)'

          - task: TerraformTaskV4@4
            displayName: Validate
            inputs:
              provider: "azurerm"
              command: "validate"
          - task: TerraformTaskV4@4
            displayName: Terraform Plan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              commandOptions: "-var-file=dev.tfvars"
              environmentServiceNameAzureRM: 'mysubscription-azuresub'
          - task: PowerShell@2
            displayName: check public ip
            inputs:
              targetType: 'inline'
              script: 'Invoke-RestMethod http://ipinfo.io/json | Select -exp ip'
